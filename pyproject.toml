[project]
name = "researchmind"
version = "0.2.0"
description = "Multi-paper research analysis platform with pgvector search, an agentic literature-review assistant and LLM-powered reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.6",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
