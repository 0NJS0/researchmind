# ResearchMind on the homelab — one container: API + React UI + the 24/7 autopilot.
#
# External services (configured in .env, nothing secret in this file):
#   PostgreSQL + pgvector (DATABASE_URL), SearXNG (SEARXNG_URL), OpenRouter (LLM_API_KEY), OpenAlex (OPENALEX_API_KEY)
#
# Deploy:   docker compose up -d --build
# Open:     http://<homelab-ip>:47813
# Logs:     docker compose logs -f researchmind
services:
  researchmind:
    build: .
    image: researchmind:latest
    container_name: researchmind
    restart: unless-stopped
    ports:
      - "${RESEARCHMIND_PORT:-47813}:8000"     # 47813 was free on the homelab; override in .env if needed
    env_file: .env
    environment:
      - PAPERS_DIR=/data/papers
    volumes:
      # PDFs, per-paper analyses and reports live in a host folder (easy to back up). Default: ./data/papers
      # The folder must exist and be writable by uid 1000 (the container user):
      #   mkdir -p ./data/papers
      #   sudo chown -R 1000:1000 ./data
      # Override the location with PAPERS_HOST_DIR in .env.
      - type: bind
        source: ${PAPERS_HOST_DIR:-./data/papers}
        target: /data/papers
        bind:
          create_host_path: false   # fail clearly instead of Docker creating a root-owned folder
    stop_grace_period: 30s                     # lets the autopilot finish writing before shutdown
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
