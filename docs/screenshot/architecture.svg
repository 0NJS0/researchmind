<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker></defs><rect width="1920" height="1080" fill="#0b0d12"/>
<text x="60" y="74" font-size="40" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">ResearchMind · architecture</text>
<text x="60" y="114" font-size="21" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">A self-hosted literature-review assistant. One Docker container, free LLMs only, running 24/7.</text>
<rect x="40" y="140" width="1430" height="910" rx="20" fill="none" stroke="#3a4258" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="64" y="172" font-size="15" fill="#9aa3b2" font-weight="700" text-anchor="start" xml:space="preserve">DOCKER CONTAINER</text>
<rect x="70" y="190" width="330" height="445" rx="14" fill="#181c26" stroke="#2a3040" stroke-width="1.5"/>
<text x="92" y="231" font-size="21" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">React UI</text>
<text x="92" y="266" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">React 19 · TypeScript · Tailwind</text>
<text x="92" y="297" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve"></text>
<text x="92" y="328" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Autopilot</text>
<text x="92" y="359" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Papers</text>
<text x="92" y="390" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Research gaps</text>
<text x="92" y="421" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Topic validator</text>
<text x="92" y="452" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Library</text>
<text x="92" y="483" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Ask</text>
<text x="92" y="514" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Reports</text>
<text x="92" y="545" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Status</text>
<polyline points="235,637 235,671" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="70" y="675" width="330" height="345" rx="14" fill="#181c26" stroke="#2a3040" stroke-width="1.5"/>
<text x="92" y="716" font-size="21" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">FastAPI backend</text>
<text x="92" y="751" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">Serves the UI and REST API</text>
<text x="92" y="782" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve"></text>
<text x="92" y="813" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  PDF upload → chunk → embed</text>
<text x="92" y="844" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Streaming answers</text>
<text x="92" y="875" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Background jobs</text>
<text x="92" y="906" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  Health &amp; free-quota status</text>
<text x="92" y="937" font-size="17" fill="#e7e9ee" font-weight="400" text-anchor="start" xml:space="preserve">•  CSV / report export</text>
