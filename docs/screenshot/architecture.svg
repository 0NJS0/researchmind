<polyline points="402,915 434,915" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="440" y="190" width="1000" height="590" rx="18" fill="#12151d" stroke="#343b52" stroke-width="1.5"/>
<text x="468" y="230" font-size="25" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">Autopilot</text>
<text x="625" y="230" font-size="18" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">24/7 worker · one paper at a time · resumes after restarts</text>
<rect x="470" y="260" width="290" height="160" rx="14" fill="#181c26" stroke="#2a3040" stroke-width="1.5"/>
<circle cx="504" cy="294" r="14" fill="#818cf8"/>
<text x="504" y="300" font-size="16" fill="#0b0d12" font-weight="700" text-anchor="middle" xml:space="preserve">1</text>
<text x="528" y="301" font-size="21" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">Discover</text>
<text x="492" y="336" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">SearXNG + OpenAlex</text>
<text x="492" y="362" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">queries grow from the</text>
<text x="492" y="388" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">papers and gaps so far</text>
<rect x="800" y="260" width="290" height="160" rx="14" fill="#181c26" stroke="#2a3040" stroke-width="1.5"/>
<circle cx="834" cy="294" r="14" fill="#818cf8"/>
<text x="834" y="300" font-size="16" fill="#0b0d12" font-weight="700" text-anchor="middle" xml:space="preserve">2</text>
<text x="858" y="301" font-size="21" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">Screen &amp; rank</text>
<text x="822" y="336" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">relevance · recency</text>
<text x="822" y="362" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">citations · peer review</text>
<text x="822" y="388" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">duplicates merged</text>
<rect x="1130" y="260" width="280" height="160" rx="14" fill="#181c26" stroke="#2a3040" stroke-width="1.5"/>
<circle cx="1164" cy="294" r="14" fill="#818cf8"/>
<text x="1164" y="300" font-size="16" fill="#0b0d12" font-weight="700" text-anchor="middle" xml:space="preserve">3</text>
<text x="1188" y="301" font-size="21" fill="#e7e9ee" font-weight="700" text-anchor="start" xml:space="preserve">Full text</text>
<text x="1152" y="336" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">open-access copies only</text>
<text x="1152" y="362" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">OpenAlex · arXiv</text>
<text x="1152" y="388" font-size="17" fill="#9aa3b2" font-weight="400" text-anchor="start" xml:space="preserve">Semantic Scholar</text>
